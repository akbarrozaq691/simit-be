services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simit}
      POSTGRES_USER: ${POSTGRES_USER:-simit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      # Loopback only: the app reaches Postgres over the compose network, so
      # publishing this at all is a convenience for local psql clients. On
      # 0.0.0.0 it is the database itself exposed to the network.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
    ports:
      # Bound to loopback by default: with nginx on the host, the only thing that
      # needs to reach the app is the proxy on the same machine, and publishing
      # on 0.0.0.0 puts the whole API — including /docs — straight on the
      # network. Set APP_BIND=0.0.0.0 to reach it from elsewhere, which the
      # containerised frontend in ../fe needs.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8888}:8888"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
